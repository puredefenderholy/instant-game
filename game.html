<!DOCTYPE html>
<html>
<head>
  <title>Instant Game</title>
  <style>
    canvas { background: #111; display: block; margin: 0 auto; }
  </style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let player = { x: 180, y: 350, w: 40, h: 40 };
let obstacles = [];
let score = 0;
let speed = 2;

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') player.x -= 20;
  if(e.key === 'ArrowRight') player.x += 20;
  if(player.x < 0) player.x = 0;
  if(player.x > 360) player.x = 360;
});

function spawnObstacle() {
  let x = Math.random() * 360;
  obstacles.push({ x, y: 0, w: 40, h: 40 });
}

function update() {
  ctx.clearRect(0,0,400,400);
  // Draw player
  ctx.fillStyle = 'lime';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Move and draw obstacles
  ctx.fillStyle = 'red';
  for(let i = 0; i < obstacles.length; i++) {
    obstacles[i].y += speed;
    ctx.fillRect(obstacles[i].x, obstacles[i].y, obstacles[i].w, obstacles[i].h);
    // Collision
    if(player.x < obstacles[i].x + obstacles[i].w &&
       player.x + player.w > obstacles[i].x &&
       player.y < obstacles[i].y + obstacles[i].h &&
       player.y + player.h > obstacles[i].y) {
      alert("Game Over! Score: " + score);
      document.location.reload();
    }
    if(obstacles[i].y > 400) {
      obstacles.splice(i, 1);
      i--;
      score++;
    }
  }

  ctx.fillStyle = 'white';
  ctx.font = '20px Arial';
  ctx.fillText("Score: " + score, 10, 30);

  requestAnimationFrame(update);
}

// Spawn obstacles every second
setInterval(spawnObstacle, 1000);
update();
</script>
</body>
</html>
